<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Level Up Method — Etapa 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
  body { font-family: -apple-system, Arial, sans-serif; background: #14161a; color: #eee; margin: 0; padding: 0; }
  .map-wrap { position: relative; width: 100%; max-width: 1536px; margin: 0 auto; }
  .map-wrap img { width: 100%; display: block; }
  .node {
    position: absolute;
    width: 6.2%;
    aspect-ratio: 1 / 1;
    transform: translate(-50%, -50%);
    border-radius: 50%;
  }
  .node.clickable { cursor: pointer; }
  .node.locked {
    background: rgba(10, 10, 10, 0.55);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.4vw;
  }
  .node.current {
    box-shadow: 0 0 0 4px #ffd447, 0 0 18px 4px rgba(255, 212, 71, 0.8);
    animation: pulse 1.4s infinite;
  }
  .node.done::after {
    content: "✓";
    position: absolute;
    top: -6px; right: -6px;
    background: #3b6d11;
    color: #eaf3de;
    width: 22px; height: 22px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700;
    border: 2px solid #14161a;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 4px #ffd447, 0 0 14px 2px rgba(255, 212, 71, 0.7); }
    50% { box-shadow: 0 0 0 6px #ffd447, 0 0 24px 8px rgba(255, 212, 71, 0.9); }
  }
  .hud-card {
    position: absolute;
    transform: translate(-50%, -50%);
    background: #f2e6cf;
    border-radius: 14px;
    box-shadow: 0 0 0 1px #c9b48c, inset 0 1px 2px rgba(255,255,255,0.6);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #2c3a35;
    font-family: 'Fredoka', -apple-system, Arial, sans-serif;
  }
  .hud-card .label { font-size: 0.78vw; letter-spacing: 0.06em; color: #6b5b3e; font-weight: 600; }
  .hud-card .value { font-size: 1.6vw; font-weight: 700; display: flex; align-items: center; gap: 4px; }
  .hud-card.coins .value { color: #a3720b; }
  .xp-track { width: 78%; height: 6px; border-radius: 3px; background: #d8c8a4; overflow: hidden; margin-top: 3px; }
  .xp-fill { height: 100%; background: #6b8f3d; }
  .locked-msg { text-align: center; color: #888; font-size: 14px; padding: 60px 20px; }
</style>
</head>
<body>

<div id="app">
  <p class="locked-msg">Carregando progresso...</p>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAqczo4JjxOm_RvN4SH6Mo3eTe6cDRqLiI",
    authDomain: "level-up-method.firebaseapp.com",
    projectId: "level-up-method",
    storageBucket: "level-up-method.firebasestorage.app",
    messagingSenderId: "69672690105",
    appId: "1:69672690105:web:d7d23b3b8f8ea7e3e6d668"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const XP_PER_LEVEL = 100; // 1 aula completa (20 START + 40 LEVEL UP + 40 UNLOCK) = 1 nível

  const positions = [
    { n: 1, xPct: 16.6, yPct: 59.1 },
    { n: 2, xPct: 28.0, yPct: 43.0 },
    { n: 3, xPct: 45.2, yPct: 26.4 },
    { n: 4, xPct: 51.1, yPct: 48.3 },
    { n: 5, xPct: 62.2, yPct: 62.0 },
    { n: 6, xPct: 78.6, yPct: 50.8 },
    { n: 7, xPct: 73.6, yPct: 33.2 }
  ];

  async function render() {
    const params = new URLSearchParams(window.location.search);
    const alunoId = params.get("aluno");
    const app_el = document.getElementById("app");

    if (!alunoId) {
      app_el.innerHTML = '<p class="locked-msg">Link inválido: falta o identificador do aluno na URL (?aluno=...)</p>';
      return;
    }

    const ref = doc(db, "alunos", alunoId);
    const snap = await getDoc(ref);

    if (!snap.exists()) {
      app_el.innerHTML = '<p class="locked-msg">Aluno não encontrado. Confira o link ou fale com a Teacher Ana.</p>';
      return;
    }

    const data = snap.data();
    const nosCompletos = data.nosCompletos || [];
    const noAtual = data.noAtual || 1;
    const xp = data.xp || 0;
    const coins = data.coins || 0;

    const level = Math.floor(xp / XP_PER_LEVEL) + 1;
    const xpInLevel = xp % XP_PER_LEVEL;
    const xpPct = Math.round((xpInLevel / XP_PER_LEVEL) * 100);

    let nodesHtml = "";
    positions.forEach(p => {
      const isDone = nosCompletos.includes(p.n);
      const isCurrent = p.n === noAtual && !isDone;
      const lessonUrl = `aulas/etapa1-aula${p.n}.html?aluno=${encodeURIComponent(alunoId)}`;

      let classes = "node";
      let inner = "";
      let tag = "div";
      let hrefAttr = "";

      if (isDone) { classes += " done clickable"; tag = "a"; hrefAttr = `href="${lessonUrl}"`; }
      else if (isCurrent) { classes += " current clickable"; tag = "a"; hrefAttr = `href="${lessonUrl}"`; }
      else { classes += " locked"; inner = "🔒"; }

      nodesHtml += `<${tag} ${hrefAttr} class="${classes}" style="left:${p.xPct}%; top:${p.yPct}%;">${inner}</${tag}>`;
    });

    app_el.innerHTML = `
      <div class="map-wrap">
        <img src="images/etapa1-mapa.png" alt="Mapa da Etapa 1 — Construindo a própria voz" />

        <div class="hud-card" style="left:59.4%; top:9.5%; width:12%; height:11.5%;">
          <span class="label">LEVEL</span>
          <span class="value">${level} ⭐</span>
        </div>

        <div class="hud-card" style="left:71.2%; top:9.5%; width:12.5%; height:11.5%;">
          <span class="label">XP</span>
          <span class="value" style="font-size:1.15vw;">${xpInLevel}/${XP_PER_LEVEL}</span>
          <div class="xp-track"><div class="xp-fill" style="width:${xpPct}%;"></div></div>
        </div>

        <div class="hud-card coins" style="left:83.7%; top:9.5%; width:12.5%; height:11.5%;">
          <span class="label">COINS</span>
          <span class="value">${coins} 🪙</span>
        </div>

        ${nodesHtml}
      </div>
    `;
  }

  render();
</script>

</body>
</html>
